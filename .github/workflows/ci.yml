# ─────────────────────────────────────────────────────────────────────────────
# NO IMAGE IS EVER PUSHED FROM HERE. CLAUDE.md rule 18: pushing images to any
# registry is forbidden until release gate R1.
#
# The reason is concrete, not procedural. A FilmBill v1 is running on the
# production server and is auto-updated by Watchtower from Docker Hub. An
# image published under a v1-shaped name would be pulled and would REPLACE
# a live production system that is still issuing real invoices. The
# docker-build job below therefore builds every image and pushes none — it
# proves the Dockerfiles work, nothing more. Do not add a login or a push
# step to this file before R1.
# ─────────────────────────────────────────────────────────────────────────────

name: CI

# Every `run:` step in this file uses an EXPLICIT bash, and the difference is
# `pipefail`. GitHub's documented shells (github/docs
# `data/reusables/actions/supported-shells.md`) are:
#
#   shell: unspecified  ->  bash -e {0}
#   shell: bash         ->  bash --noprofile --norc -eo pipefail {0}
#
# and the table's own note says "this runs a different command to when `bash`
# is specified explicitly". Without the explicit shell, `pytest | tee` reports
# TEE's exit status and a failing suite leaves a green step — which is exactly
# what happened here (see docs/engineering/test-harness-traps.md, instance 19).
#
# The per-step `set -o pipefail` lines are kept deliberately. They are not
# redundant: they keep each step correct on its own, so deleting this block —
# or a job overriding `defaults` with one of its own, which GitHub allows —
# cannot quietly take pipefail away again. `tests/test_workflow_pipelines.py`
# is the check that neither disappears.
defaults:
  run:
    shell: bash

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── API ───────────────────────────────────────────────────────────────────
  api-tests:
    name: API tests
    runs-on: ubuntu-latest

    # Real Postgres and Redis alongside the job. The suite mocks the session
    # today, but the services are here from the start because the moment
    # anything talks to a database for real — the Alembic baseline, P0b's
    # company scoping — CI has to be the place that finds it, not the server.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: filmbill
          POSTGRES_PASSWORD: filmbill
          POSTGRES_DB: filmbill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filmbill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://filmbill:filmbill@localhost:5432/filmbill_test
      REDIS_URL: redis://localhost:6379/0
      S3_BUCKET: filmbill-test
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: testkey
      S3_SECRET_KEY: testsecret
      S3_REGION: us-east-1
      JWT_SECRET: ci-test-secret-key-not-for-production
      FRONTEND_URL: http://localhost:3100
      GOTENBERG_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches apps/api/Dockerfile. A test suite that passes on a
          # different interpreter than production runs is a test suite that
          # has not checked production.
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install dependencies
        run: pip install -r apps/api/requirements.txt

      - name: pip check
        run: pip check

      # `-rs` so every skip and its reason is IN THE LOG. A skip nobody can
      # see is the shape that has cost this project three green runs that had
      # not run — see the real-database guard two steps down, and
      # docs/engineering/test-harness-traps.md.
      # `set -o pipefail` is the whole reason this is a block and not a
      # one-liner. GitHub Actions runs `run:` as `bash -e {0}` — WITHOUT
      # pipefail — so `pytest | tee` reports tee's exit status and a failing
      # suite leaves a green step. That is not hypothetical: two tests in
      # `test_seed_dev_parties.py` failed on main from 11afc1d until A1 and
      # every run stayed green, because the only thing left checking was the
      # passed-count floor below, which was then 750 — and 2267 of 2269
      # clears 750 without a flicker. Both floors are now within 3 %.
      # Nineteenth instance of docs/engineering/test-harness-traps.md.
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest apps/api/tests/ -q --tb=short -rs | tee test-output.txt

      # The suite is the guard against the API surface widening, media code
      # coming back, and Celery tasks landing on a queue nobody consumes.
      # A suite that quietly shrinks takes all of that with it, and a green
      # run on three remaining tests looks identical to a green run on three
      # hundred.
      - name: Guard against a gutted suite
        run: |
          # `|| true` is load-bearing: with pipefail on (below), a grep
          # that matches nothing fails the pipeline, and a failing pipeline
          # inside $( ) aborts the whole step under `-e` — silently, before
          # the `-z` check below can print anything useful.
          PASSED=$(grep -oE '[0-9]+ passed' test-output.txt | grep -oE '[0-9]+' | head -1 || true)
          echo "Tests passed: ${PASSED:-0}"
          # 2900, set at B2b's close (2026-11-26). The suite was 2984
          # passing on the declared local run (python:3.11 image, dev-stack
          # Postgres + Redis, 30 skipped there) and CI runs about 27 more
          # than that, so roughly 3010 in CI. 2900 is 2.8 % under the local
          # count. (B2a set 2790 at 2868; B1.2 2710 at 2789; B1.1 2650 at
          # 2700; B1 2580 at 2626; A2 2410 at 2450; A1 2200 at 2275.)
          #
          # Why 3 % and not the 67 % of slack this floor used to carry: the
          # previous value was 750, set when the suite was 814, and never
          # moved while the suite grew to 2275. By then it could absorb two
          # thirds of the suite vanishing, and it DID absorb two failing
          # tests for months — it was the only check left once `| tee` ate
          # the exit code (trap 19). A floor is not a safety net; it is what
          # is left when the real check breaks, so it has to sit just under
          # the real number.
          #
          # 3 % is the tightest margin that does not redden the build on
          # ordinary churn — a handful of tests deleted along with a feature.
          # It will NOT notice ten tests going missing; nothing this shape
          # can. It notices a collapse, which is what it is for. Per
          # CLAUDE.md, the closing commit of every phase moves it back up.
          if [ -z "$PASSED" ] || [ "$PASSED" -lt 2900 ]; then
            echo "::error::Expected at least 2900 passing tests, got ${PASSED:-0}."
            exit 1
          fi

      # The checks a MagicMock session cannot perform: a unique constraint,
      # a real `WHERE company_id = ...`, a trigger, `SELECT … FOR UPDATE`.
      # They SKIP where there is no database, which is right on a laptop and
      # wrong here — so `tests/conftest._no_postgres` fails instead when `CI`
      # is set, and this step asserts the result is a pass count rather than
      # a skip count. Without it, deleting the `postgres` service below would
      # turn 130 checks into 130 skips and the job would stay green.
      - name: Real-database tests ran, not skipped
        run: |
          # Same reason as the step above: without pipefail this `| tee`
          # throws away pytest's exit status, so a real-database test that
          # FAILS (as opposed to skipping, which the check below catches)
          # would never reach these assertions.
          set -o pipefail
          python -m pytest apps/api/tests/ -m realdb -q --tb=short -rs | tee realdb-output.txt
          # Both `|| true`s for the reason given in the step above. The
          # SKIPPED one matters most: finding no "skipped" is the GOOD
          # case, and without the guard the healthy run is the one that dies.
          PASSED=$(grep -oE '[0-9]+ passed' realdb-output.txt | grep -oE '[0-9]+' | head -1 || true)
          SKIPPED=$(grep -oE '[0-9]+ skipped' realdb-output.txt | grep -oE '[0-9]+' | head -1 || true)
          echo "Real-database tests passed: ${PASSED:-0}, skipped: ${SKIPPED:-0}"
          # 1525, set at B2b's close (2026-11-26) when `-m realdb` was 1568
          # passing — 2.7 % under (B2a set 1415 at 1455; B1.2 1345 at 1385; B1.1 1280 at 1316;
          # B1 1210 at 1244; A2 1095 at 1124), for the same reason as the
          # floor in the step above — and with the same history: this was
          # 120 while the real count was 931, so seven eighths of the
          # real-database suite could have stopped running unnoticed.
          if [ -z "$PASSED" ] || [ "$PASSED" -lt 1525 ]; then
            echo "::error::Expected at least 1525 passing real-database tests, got ${PASSED:-0}. A real-database check that does not RUN is not a check."
            exit 1
          fi
          if [ -n "$SKIPPED" ] && [ "$SKIPPED" -gt 0 ]; then
            echo "::error::${SKIPPED} real-database test(s) SKIPPED in CI. A skip in CI is not a green."
            exit 1
          fi

      - name: Alembic history is linear and applies to an empty database
        run: |
          cd apps/api
          alembic upgrade head
          alembic check
          alembic downgrade base

  # ─── Alembic vs models ─────────────────────────────────────────────────────
  migrations-match-models:
    name: Migrations match the models
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: filmbill
          POSTGRES_PASSWORD: filmbill
          POSTGRES_DB: filmbill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filmbill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://filmbill:filmbill@localhost:5432/filmbill_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt

      # CLAUDE.md rule 9: every schema change is a migration. This is what
      # makes that checkable — a model edited without one shows up here as a
      # pending autogenerate diff, in the PR that made it.
      - name: No pending model changes
        run: |
          cd apps/api
          alembic upgrade head
          alembic check

  # ─── Web ───────────────────────────────────────────────────────────────────
  web:
    name: Web lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No continue-on-error on any of these. A check allowed to fail is a
      # check that reports nothing, and FreeFrame's CI carried exactly that
      # on its typecheck and lint steps.
      - name: Lint
        run: pnpm --filter web lint

      - name: Typecheck
        run: pnpm --filter web typecheck

      - name: Test
        run: pnpm --filter web test

      - name: Build
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: /api

  # ─── Generated API types ───────────────────────────────────────────────────
  api-types-are-generated:
    name: API types match the schema
    runs-on: ubuntu-latest

    # CLAUDE.md rule 10. FreeFrame's hand-written response interfaces drifted
    # from its Pydantic schemas repeatedly, and the drift is invisible: the
    # app compiles, the types are simply wrong about what arrives. This job is
    # what makes "generated, never hand-edited" enforceable.
    #
    # The very first run of it found one — the hand-written `User` carried a
    # `deleted_at` that /auth/me has never sent.
    #
    # It needs BOTH toolchains, which is why it is its own job rather than a
    # step in `web`: the schema comes from importing the FastAPI app (no
    # server, no database — see apps/api/scripts/dump_openapi.py) and the
    # TypeScript comes from openapi-typescript.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r apps/api/requirements.txt

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Regenerate
        run: pnpm gen:api

      # `--exit-code` rather than a diff somebody has to read in the log: a
      # non-zero exit is the whole signal, and the diff is printed alongside it
      # so the fix is one `pnpm gen:api` away.
      - name: apps/web/types/api.gen.ts is up to date
        run: |
          if ! git diff --exit-code apps/web/types/api.gen.ts; then
            echo "::error::apps/web/types/api.gen.ts is out of date. Run 'pnpm gen:api' and commit the result — do not hand-edit it (CLAUDE.md rule 10)."
            exit 1
          fi

  # ─── Images ────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Every buildable service, together. CLAUDE.md rule 14: Compose tags
      # one image per service even when several share a Dockerfile, so
      # building only one of them is how a stale worker ends up next to a
      # fresh API.
      - name: Build API image (dev)
        run: docker build -t filmbill-api:ci -f apps/api/Dockerfile .

      - name: Build API image (prod)
        run: docker build -t filmbill-api:ci-prod -f apps/api/Dockerfile.prod .

      # Google's font hosts point at 127.0.0.1 for this build, so a font
      # fetched at build time fails here on EVERY run, not only on the day
      # Google answers badly. That day was 2a6f120: `next/font/google` died
      # inside `next build`, and the fix is the self-hosted DM Sans in
      # apps/web/fonts/. A new `next/font/google` import turns this red.
      - name: Build web image (prod)
        run: |
          docker build \
            --add-host fonts.googleapis.com=127.0.0.1 \
            --add-host fonts.gstatic.com=127.0.0.1 \
            -t filmbill-web:ci-prod -f apps/web/Dockerfile.prod .

      - name: Compose files are valid
        run: |
          cp .env.example .env
          cp .env.example .env.prod
          docker compose -f docker-compose.dev.yml config -q
          docker compose --env-file .env.prod -f docker-compose.prod.yml config -q
          rm -f .env .env.prod

      - name: Confirm nothing was pushed
        run: |
          # Belt and braces for CLAUDE.md rule 18. If a push step is ever
          # added above, this is the line that should make the reviewer ask
          # why it is being removed.
          echo "Images built locally only. No registry login, no push."
