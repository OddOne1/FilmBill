# FilmBill — development stack.
#
# Every published port is offset from FreeFrame's so both stacks can run side
# by side on this machine (CLAUDE.md, Local development):
#   web 3100 · api 8100 · mailpit UI 8125 · minio console 9101
#   postgres 5533 · redis 6380 · minio API 9100
#
# Start:  docker compose -f docker-compose.dev.yml up --build
name: filmbill

services:
  postgres:
    image: postgres:15-alpine
    container_name: filmbill_postgres
    environment:
      POSTGRES_USER: filmbill
      POSTGRES_PASSWORD: filmbill
      POSTGRES_DB: filmbill
    ports:
      - "5533:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filmbill"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: filmbill_redis
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: filmbill_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_CORS_ALLOW_ORIGIN: http://localhost:3100
      MINIO_CORS_ALLOW_METHODS: GET,PUT,POST,DELETE,HEAD
      MINIO_CORS_ALLOW_HEADERS: "*"
      MINIO_CORS_EXPOSE_HEADERS: ETag,Content-Length,x-amz-request-id
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: filmbill_minio_init
    depends_on:
      minio:
        condition: service_healthy
    # No `mc anonymous set download`: nothing in FilmBill is world-readable
    # from the bucket. Every browser read goes through the API's object
    # proxy (apps/api/routers/files.py).
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/filmbill;
      exit 0;
      "

  # HTML → PDF. The only renderer in the system (SCOPE §7.3).
  #
  # Exact tag, no floating major: a Chromium version change alters page
  # rendering, and an invoice that silently re-flows is a document problem,
  # not a dependency problem. NO PUBLISHED PORT — it is reachable from the
  # api and worker containers on the compose network and from nowhere else.
  gotenberg:
    image: gotenberg/gotenberg:8.21.1
    container_name: filmbill_gotenberg
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=false"
      - "--api-timeout=60s"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Catches every outgoing mail in dev. SMTP on 1025 inside the network,
  # web UI on http://localhost:8125.
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: filmbill_mailpit
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "8125:8025"
    healthcheck:
      test: ["CMD", "sh", "-c", "nc -z localhost 1025"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: filmbill_api
    ports:
      - "8100:8000"
    env_file:
      - .env
    environment: &api_env
      DATABASE_URL: postgresql://filmbill:filmbill@postgres:5432/filmbill
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:3100
      # Storage: "minio" for local MinIO (dev), "s3" for AWS S3 (prod)
      S3_STORAGE: minio
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: filmbill
      S3_REGION: us-east-1
      S3_PUBLIC_ENDPOINT: http://localhost:9100
      GOTENBERG_URL: http://gotenberg:3000
      # Dev mail goes to Mailpit, always. No credentials, no TLS, nothing
      # leaves this machine.
      MAIL_PROVIDER: smtp
      MAIL_FROM_ADDRESS: noreply@filmbill.local
      MAIL_FROM_NAME: FilmBill
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_USE_TLS: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      gotenberg:
        condition: service_started
      mailpit:
        condition: service_started
    volumes:
      - ./apps/api:/workspace/apps/api
    command: >
      sh -c "cd /workspace/apps/api && alembic upgrade head && cd /workspace && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload"

  # Consumes the `documents` queue. Nothing publishes to it in P0a — it is
  # here so PDF rendering, e-invoice XML and archive packaging have a home
  # that is not the mail worker from the moment they land (P2).
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: filmbill_worker
    env_file:
      - .env
    environment: *api_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./apps/api:/workspace/apps/api
    command: celery -A apps.api.tasks.celery_app worker -Q documents -c ${DOCUMENT_CONCURRENCY:-2} --loglevel=info

  email_worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: filmbill_email_worker
    env_file:
      - .env
    environment: *api_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    volumes:
      - ./apps/api:/workspace/apps/api
    command: celery -A apps.api.tasks.celery_app worker -Q email_high,email_low -c ${EMAIL_CONCURRENCY:-2} --loglevel=info

  # Scheduler. Its beat_schedule is empty in P0a (see tasks/celery_app.py);
  # the service exists so a scheduled job never arrives without a process
  # that runs it — the failure mode FreeFrame hit four times.
  beat:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: filmbill_beat
    env_file:
      - .env
    environment: *api_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/workspace/apps/api
    command: celery -A apps.api.tasks.celery_app beat --loglevel=info

  # Runs from the REPO ROOT inside the container, not from apps/web: this is
  # a pnpm workspace and `--frozen-lockfile` needs pnpm-workspace.yaml and
  # the single root lockfile. Installing from apps/web alone would resolve a
  # different dependency tree than the production image builds.
  web:
    image: node:20-alpine
    container_name: filmbill_web
    working_dir: /repo
    ports:
      - "3100:3000"
    environment:
      # What the BROWSER uses.
      - NEXT_PUBLIC_API_URL=http://localhost:8100
      # What Next's SERVER-SIDE code uses (CLAUDE.md rule 15). Without it,
      # fetchSiteSettingsServer falls back to localhost:8000 — which inside
      # this container is nothing — so the login page silently renders the
      # bundled logo and the 2FA setting arrives only after first paint.
      # It fails quietly, which is why it needs to be stated here.
      - API_INTERNAL_URL=http://api:8000
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
    volumes:
      - ./apps/web:/repo/apps/web
      - ./package.json:/repo/package.json
      - ./pnpm-lock.yaml:/repo/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/repo/pnpm-workspace.yaml
      # Named volumes so a Linux install is never shadowed by the host's.
      - web_node_modules:/repo/node_modules
      - web_app_node_modules:/repo/apps/web/node_modules
      # And so does .next: it is inside the bind-mounted source tree, so a
      # host-side `pnpm build` or `rm -rf .next` otherwise pulls the running
      # dev server's cache out from under it mid-request. It then throws
      # ENOENT on a webpack pack file and stops serving — which looks like a
      # broken app rather than like two processes sharing one directory.
      - web_next_cache:/repo/apps/web/.next
    command: >
      sh -c "corepack enable &&
      corepack prepare pnpm@9.12.3 --activate &&
      pnpm install --frozen-lockfile &&
      pnpm --filter web exec next dev --hostname 0.0.0.0"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

volumes:
  pgdata:
  miniodata:
  redisdata:
  web_node_modules:
  web_app_node_modules:
  web_next_cache:
