[pytest]
testpaths = apps/api/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    realdb: needs a real PostgreSQL database. Applied automatically from the
        pg_engine/pg_db/pg_client fixtures (see tests/conftest.py), so
        `pytest -m realdb` counts the checks only a real database can
        perform. CI asserts that number is a pass count and not a skip count.
