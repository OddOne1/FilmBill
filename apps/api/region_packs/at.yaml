# ─────────────────────────────────────────────────────────────────────────────
# Austria.
#
# NOT TAX ADVICE AND NOT REVIEWED. [Likely] — the rates below are the ones in
# ordinary public use and they are question 9 for the Steuerberater
# (docs/SCOPE.md §17). Until that is answered they are a starting point a user
# can edit, which is the whole point of them being data (CLAUDE.md rule 7).
#
#   20 %  Normalsteuersatz
#   13 %  ermäßigt
#   10 %  ermäßigt
#    0 %
#
# **Which rate the class `reduced` means.** The prompt that commissioned this
# pack said "reduced 13, reduced_2 10" in one place and "class reduced →
# AT-10" in its golden fixtures in another. They cannot both hold. This pack
# follows the fixtures and ordinary Austrian usage: `reduced` is the 10 % rate
# (the broad one — food, rent, books, cultural admissions) and `reduced_2` is
# 13 %. Both codes exist either way, so a company whose advisor disagrees
# re-points one class and changes nothing else. Flagged in §17 question 9(a).
#
# This pack EXTENDS eu_generic: the reverse-charge, intra-community, export,
# not-taxable and exemption codes and all eight rules come from there, and are
# not repeated here. Anything this file declares with the same key replaces
# what the generic pack said.
# ─────────────────────────────────────────────────────────────────────────────
pack: at
name: Österreich
extends: eu_generic
countries: [AT]

codes:
  - code: AT-20
    name: 20 % USt (Normalsteuersatz)
    rate: "20"
    category: S

  - code: AT-13
    name: 13 % USt (ermäßigt)
    rate: "13"
    category: S

  - code: AT-10
    name: 10 % USt (ermäßigt)
    rate: "10"
    category: S

  - code: AT-0
    name: 0 % USt
    rate: "0"
    category: Z

classes:
  - key: standard
    label: Normalsteuersatz (20 %)
    code: AT-20
    position: 10
  - key: reduced
    label: Ermäßigt (10 %)
    code: AT-10
    position: 20
  - key: reduced_2
    label: Ermäßigt (13 %)
    code: AT-13
    position: 30
  - key: zero
    label: Steuersatz 0 %
    code: AT-0
    position: 40
