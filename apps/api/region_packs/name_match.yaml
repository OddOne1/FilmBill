# ─────────────────────────────────────────────────────────────────────────────
# Comparing a party's name with the one a tax register holds.
#
# Data, not code (CLAUDE.md rule 7): the legal-form list grows with every
# country a user invoices, and adding "Pty Ltd" must not need a release.
#
# **What this is for.** A VAT number can be valid and belong to somebody
# else. The registry's name is the only cheap check against that, and a
# mismatch is the signal worth a human's attention. **What it is not for:**
# correcting anybody's data. FilmBill never writes a registry's name onto a
# party — the company's own records are the company's own, several registers
# hold stale or abbreviated forms, and a tool that "helpfully" overwrote a
# customer's legal name would be editing the thing that goes on an invoice.
# ─────────────────────────────────────────────────────────────────────────────

# Scores are 0..100. Chosen to be defensible rather than tuned, and
# deliberately generous about `partial`: the cost of a false `mismatch` is a
# user chasing a non-problem, while the cost of a false `match` is a missed
# warning on a reverse charge. So the band between them is wide and lands in
# `partial`, which says "look at this" without claiming either.
thresholds:
  # At or above: `match`.
  match: 92
  # At or above (and below `match`): `partial`.
  partial: 65
  # Below `partial`: `mismatch`.

# Stripped from both names before comparing. A company called "Mustermann
# GmbH" in our records and "MUSTERMANN GESELLSCHAFT M.B.H." in the register
# is the same company, and no amount of string distance will say so while
# the legal form is still in the string — the forms are longer than the name.
#
# Longest first matters: "gesellschaft mit beschrankter haftung" has to go
# before "gesellschaft", or the remainder leaves "mit beschrankter haftung"
# behind as if it were part of the name. The loader sorts by length, so the
# order here is for human reading only.
legal_forms:
  # German-speaking
  - gesellschaft mit beschrankter haftung
  - gesellschaft m b h
  - gesellschaft mbh
  - gmbh and co kg
  - gmbh and co kgaa
  - gmbh
  - mbh
  - aktiengesellschaft
  - ag
  - offene gesellschaft
