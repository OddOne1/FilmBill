# Treated as "the registry returned nothing usable", not as a name. Several
# member states answer with a placeholder rather than a name — Germany
# returns `---` for every lookup — and reporting that as a mismatch would
# have users correcting data that was never wrong. It is `unknown`.
placeholders:
  - "---"
  - "--"
  - "-"
  - "."
  - "n a"
  - "na"
  - "nicht verfugbar"
  - "not available"
  - "not disclosed"
  - "keine angabe"
  - "***"
  - "xxx"
  - "unknown"

# Dropped from both names: words that carry no identity and differ by
# register convention rather than by company.
noise_words:
  - the
  - and
  - und
  - of
  - der
  - die
  - das
